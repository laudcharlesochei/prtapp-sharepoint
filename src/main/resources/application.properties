# =====================================================================
#  PRT Employee Management System - SharePoint Online backend
#  Every value can be overridden with a Heroku Config Var (env var).
#  NEVER commit real secrets to this file.
# =====================================================================

spring.application.name=prtapp
spring.thymeleaf.mode=HTML
logging.level.org.springframework=INFO

# Heroku assigns the port; 8500 is the local default
server.port=${PORT:8500}
# Heroku terminates HTTPS at its router - trust X-Forwarded-* so OAuth redirect URIs are https://
server.forward-headers-strategy=framework

# ---------------------------------------------------------------------
#  SharePoint target
# ---------------------------------------------------------------------
# delegated = staff sign in with their @dundee.ac.uk account; Graph calls run as that user (recommended)
# app       = app-only (client credentials); needs admin-consented Sites.ReadWrite.All or Sites.Selected
sharepoint.auth-mode=${SHAREPOINT_AUTH_MODE:delegated}

sharepoint.site-url=${SHAREPOINT_SITE_URL:https://dmail.sharepoint.com/sites/MentorMeetingSystem}
# Optional: paste the Graph site id (host,siteCollectionGuid,webGuid) to skip the lookup
sharepoint.site-id=${SHAREPOINT_SITE_ID:}
# List name as it appears in the URL (/Lists/employee) or its GUID
sharepoint.list=${SHAREPOINT_LIST:employee}

# Internal (not display) column names in the SharePoint list.
# Visit /api/v1/sharepoint/columns after signing in to see the real names.
sharepoint.fields.first-name=${SHAREPOINT_FIELD_FIRST_NAME:FirstName}
sharepoint.fields.last-name=${SHAREPOINT_FIELD_LAST_NAME:LastName}
sharepoint.fields.email=${SHAREPOINT_FIELD_EMAIL:Email}
# What to write into the mandatory 'Title' column: email | firstName | lastName | fullName | none
sharepoint.fields.title-from=${SHAREPOINT_TITLE_FROM:email}

# ---------------------------------------------------------------------
#  Microsoft Entra ID (Azure AD) app registration
# ---------------------------------------------------------------------
# Tenant: the domain name works in place of the GUID (UPN is LOchei001@dundee.ac.uk)
azure.tenant-id=${AZURE_TENANT_ID:dundee.ac.uk}

spring.security.oauth2.client.provider.azure.authorization-uri=https://login.microsoftonline.com/${azure.tenant-id}/oauth2/v2.0/authorize
spring.security.oauth2.client.provider.azure.token-uri=https://login.microsoftonline.com/${azure.tenant-id}/oauth2/v2.0/token
spring.security.oauth2.client.provider.azure.jwk-set-uri=https://login.microsoftonline.com/${azure.tenant-id}/discovery/v2.0/keys
spring.security.oauth2.client.provider.azure.user-name-attribute=preferred_username

# Delegated sign-in (authorization code flow). Redirect URI to register in Azure:
#   https://<your-heroku-app>.herokuapp.com/login/oauth2/code/azure
#   http://localhost:8500/login/oauth2/code/azure   (local testing)
spring.security.oauth2.client.registration.azure.provider=azure
spring.security.oauth2.client.registration.azure.client-name=University of Dundee
spring.security.oauth2.client.registration.azure.client-id=${AZURE_CLIENT_ID:not-configured}
spring.security.oauth2.client.registration.azure.client-secret=${AZURE_CLIENT_SECRET:not-configured}
spring.security.oauth2.client.registration.azure.client-authentication-method=client_secret_post
spring.security.oauth2.client.registration.azure.authorization-grant-type=authorization_code
spring.security.oauth2.client.registration.azure.scope=openid,profile,email,offline_access,https://graph.microsoft.com/Sites.ReadWrite.All

# App-only (client credentials) - used only when sharepoint.auth-mode=app
spring.security.oauth2.client.registration.graph-app.provider=azure
spring.security.oauth2.client.registration.graph-app.client-id=${AZURE_CLIENT_ID:not-configured}
spring.security.oauth2.client.registration.graph-app.client-secret=${AZURE_CLIENT_SECRET:not-configured}
spring.security.oauth2.client.registration.graph-app.client-authentication-method=client_secret_post
spring.security.oauth2.client.registration.graph-app.authorization-grant-type=client_credentials
spring.security.oauth2.client.registration.graph-app.scope=https://graph.microsoft.com/.default
